<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nettskred</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="ikon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 28px 22px 40px; max-width: 34rem;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220; color: #e7edf7;
  }
  header { border-bottom: 1px solid #1e293b; padding-bottom: 14px; margin-bottom: 22px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .dato { color: #94a3b8; font-size: .9rem; margin-top: 3px; }
  h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .09em;
    color: #94a3b8; margin: 26px 0 10px; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 11px 0 11px 26px; border-bottom: 1px solid #16233a;
    position: relative; font-size: .97rem;
  }
  li:last-child { border-bottom: 0; }
  li::before { position: absolute; left: 0; top: 10px; font-size: .95rem; }
  .krav li::before { content: "▸"; color: #f59e0b; }
  .krav li.haster::before { content: "●"; color: #ef4444; }
  .gjort li::before { content: "✓"; color: #22c55e; }
  .naar { color: #f8fafc; font-weight: 600; }
  .tom { color: #64748b; font-style: italic; padding: 11px 0; }
  footer {
    margin-top: 34px; padding-top: 14px; border-top: 1px solid #1e293b;
    color: #64748b; font-size: .8rem;
  }
  footer.feil { color: #fca5a5; }
  footer button {
    margin-top: 12px; width: 100%; padding: 11px; font-size: .88rem;
    border: 1px solid #1e293b; border-radius: 10px;
    background: transparent; color: #94a3b8; cursor: pointer;
  }
  #oppsett { display: none; }
  #oppsett.vis { display: block; }
  textarea {
    width: 100%; height: 96px; margin-top: 10px; padding: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    background: #060c16; color: #94a3b8; border: 1px solid #1e293b; border-radius: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Nettskred</h1>
  <div class="dato" id="dato">Henter rapport …</div>
</header>

<div id="rapport"></div>

<footer id="footer">
  <span id="status">Kobler til …</span>
  <div id="oppsett">
    <button id="slaaPaa">Slå på varsler på denne telefonen</button>
    <button id="send" style="display:none">Send abonnementet til PC-en</button>
    <textarea id="abonnement" readonly style="display:none"></textarea>
  </div>
</footer>

<script>
const VAPID_PUBLIC = 'BEYKL5o20_0wPHYQ_wDsOH2ivzZl4W0x-WWcbO5M5PrdA-WvyFzGe9VYVSP4TnwOqcyzuy1QaxzXtEq07nCpHEI';
const KJENT_HALE = 'gT7F5bPwmcV9';

const elDato = document.getElementById('dato');
const elRapport = document.getElementById('rapport');
const elFooter = document.getElementById('footer');
const elStatus = document.getElementById('status');
const elOppsett = document.getElementById('oppsett');
const elFelt = document.getElementById('abonnement');

function base64TilUint8(b64s) {
  const pad = '='.repeat((4 - (b64s.length % 4)) % 4);
  const b64 = (b64s + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

function seksjon(tittel, punkter, klasse) {
  if (!punkter || !punkter.length) return '';
  const rader = punkter.map((p) => {
    const haster = klasse === 'krav' && /^\s*!/.test(p);
    const tekst = String(p).replace(/^\s*!/, '').trim();
    // «14:30 møte med Even» → klokkeslettet uthevet
    const m = tekst.match(/^(\d{1,2}[:.]\d{2}|\d{1,2}\.\d{1,2}\.?)\s+(.*)$/);
    const kropp = m
      ? '<span class="naar">' + esc(m[1]) + '</span> ' + esc(m[2])
      : esc(tekst);
    return '<li' + (haster ? ' class="haster"' : '') + '>' + kropp + '</li>';
  }).join('');
  return '<h2>' + esc(tittel) + '</h2><ul class="' + klasse + '">' + rader + '</ul>';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function visRapport(r, tid) {
  const d = tid ? new Date(tid) : new Date();
  const dag = d.toLocaleDateString('no-NO', { weekday: 'long', day: 'numeric', month: 'long' });
  elDato.textContent = dag.charAt(0).toUpperCase() + dag.slice(1) +
    ' · oppdatert ' + d.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });

  let html = seksjon('Krever deg', r.krever, 'krav');
  if (!r.krever || !r.krever.length) html += '<h2>Krever deg</h2><div class="tom">Ingenting venter på deg nå.</div>';
  html += seksjon('Gjort', r.gjort, 'gjort');
  elRapport.innerHTML = html;
}

async function lesRapport() {
  try {
    const c = await caches.open('nsk-varsellogg');
    const r = await c.match('/siste');
    if (!r) {
      elDato.textContent = 'Ingen rapport mottatt ennå';
      elRapport.innerHTML = '<div class="tom">Rapporten kommer med morgenvarselet.</div>';
      return;
    }
    const d = await r.json();
    let p = {};
    try { p = JSON.parse(d.tekst); } catch (e) { p = { body: d.tekst }; }
    if (p.krever || p.gjort) visRapport(p, d.tid);
    else {
      // Eldre varsel uten rapportdel — vis meldingen alene
      visRapport({ krever: [p.body || ''] }, d.tid);
    }
  } catch (e) {
    elRapport.innerHTML = '<div class="tom">Kunne ikke lese rapporten.</div>';
  }
}

async function sjekkStatus() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      elFooter.className = 'feil';
      elStatus.textContent = 'Nettleseren støtter ikke varsler. På iPhone: legg siden til på Hjem-skjermen.';
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const ab = await reg.pushManager.getSubscription();
    const kjent = ab && ab.endpoint.slice(-12) === KJENT_HALE;

    if (ab && kjent && Notification.permission === 'granted') {
      elFooter.className = '';
      elStatus.textContent = 'Varsler er på.';
      elOppsett.className = '';
      return;
    }
    elFooter.className = 'feil';
    elStatus.textContent = !ab
      ? 'Varsler er ikke slått på for denne telefonen.'
      : (!kjent ? 'Telefonen har et nytt abonnement som PC-en ikke kjenner.' : 'Varsler er blokkert i nettleseren.');
    elOppsett.className = 'vis';
    if (ab && !kjent) {
      elFelt.value = JSON.stringify(ab.toJSON());
      elFelt.style.display = 'block';
      document.getElementById('send').style.display = 'block';
    }
  } catch (e) {
    elFooter.className = 'feil';
    elStatus.textContent = 'Kunne ikke lese status: ' + e.message;
    elOppsett.className = 'vis';
  }
}

async function oppdater() { await lesRapport(); await sjekkStatus(); }
oppdater();
setInterval(oppdater, 5000);

document.getElementById('slaaPaa').addEventListener('click', async () => {
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const t = await Notification.requestPermission();
    if (t !== 'granted') throw new Error('Du sa nei til varsler. Skru det på i nettleserens innstillinger for siden.');
    let ab = await reg.pushManager.getSubscription();
    if (!ab) ab = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64TilUint8(VAPID_PUBLIC) });
    await oppdater();
  } catch (e) {
    elStatus.textContent = 'Feilet: ' + e.message;
  }
});

document.getElementById('send').addEventListener('click', () => {
  location.href = 'mailto:irma@nettskred.no?subject=' +
    encodeURIComponent('NSKVARSEL-ABONNEMENT') + '&body=' +
    encodeURIComponent('Ikke endre noe under denne linjen.\n\n' + elFelt.value);
});
</script>
</body>
</html>
